{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Password Changed" %} | FinTrack{% endblock %}

{% block auth_content %}
<div class="w-full max-w-md">
  <div class="card bg-base-100 shadow-xl">
    <div class="card-body text-center">
      <div class="text-success mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <h2 class="card-title justify-center text-2xl mb-4">{% trans "Password Changed" %}</h2>
      <p class="mb-6">{% trans "Your password is now changed." %}</p>
      <a href="{% url 'account_login' %}" class="btn btn-primary">{% trans "Sign In" %}</a>
    </div>
  </div>
</div>
{% endblock %}
